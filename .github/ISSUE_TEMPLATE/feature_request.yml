name: 功能建议 / Feature request
description: 希望增加或改进的功能
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么不方便 / What's the problem
      description: 读文献时卡在哪里、现在是怎么绕过去的
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎样 / What would help
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充 / Anything else
      description: 截图、参考的其他软件等
